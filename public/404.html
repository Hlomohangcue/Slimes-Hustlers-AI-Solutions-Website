<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | Slimes.Hustlers AI Solutions</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #d4af37;
      --background: #101010;
      --text: #f5f5f5;
      --muted: #b8b8b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main { max-width: 600px; }
    .code {
      margin: 0;
      color: var(--gold);
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      line-height: 1;
    }
    h1 { margin: 24px 0 12px; }
    p { color: var(--muted); line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 18px;
      padding: 12px 22px;
      border-radius: 6px;
      background: var(--gold);
      color: #111;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #f0cc55; }
    footer { margin-top: 42px; color: #888; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for may have moved or may no longer be available.</p>
    <a href="/">Return to homepage</a>
    <footer>Slimes.Hustlers AI Solutions · Smart AI. Smarter Business.</footer>
  </main>
</body>
</html>
